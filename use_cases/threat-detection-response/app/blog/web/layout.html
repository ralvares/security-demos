{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Unhackable Blog</title>
<style>
  :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#fff; --brand:#0f766e; --brand2:#14b8a6; --warn:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  a { color:var(--brand); text-decoration:none; } a:hover { text-decoration:underline; }
  header { background:linear-gradient(120deg,#042f2e,#0f766e 60%,#14b8a6); color:#fff; }
  .wrap { max-width:960px; margin:0 auto; padding:0 20px; }
  nav { display:flex; align-items:center; justify-content:space-between; padding:18px 0; gap:16px; flex-wrap:wrap; }
  .logo { font-weight:800; font-size:20px; letter-spacing:.5px; color:#fff; display:flex; align-items:center; gap:10px; }
  .logo svg { flex:none; }
  nav .links a { color:#ccfbf1; margin-left:18px; font-weight:600; }
  .hero { padding:36px 0 44px; }
  .hero h1 { font-size:clamp(28px,5vw,44px); line-height:1.15; margin:0 0 12px; }
  .hero p { color:#ccfbf1; max-width:620px; margin:0 0 22px; font-size:18px; }
  .badges { display:flex; gap:10px; flex-wrap:wrap; }
  .badge { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:6px 14px; font-size:14px; font-weight:600; }
  .badge b { color:#5eead4; }
  main { padding:36px 0 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; }
  .card h2 { font-size:19px; line-height:1.3; margin:6px 0 8px; }
  .meta { color:var(--muted); font-size:13px; }
  article.post { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:clamp(20px,4vw,40px); }
  article.post h1 { margin-top:0; line-height:1.2; }
  textarea { width:100%; min-height:220px; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; border:1px solid var(--line); border-radius:10px; padding:14px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:11px 20px; font-weight:700; font-size:15px; cursor:pointer; }
  button:hover { background:#115e59; }
  table { width:100%; border-collapse:collapse; margin-top:18px; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-all; }
  .ok { color:#15803d; font-weight:700; } .bad { color:var(--warn); font-weight:700; }
  footer { border-top:1px solid var(--line); color:var(--muted); font-size:13px; padding:22px 0 40px; }
  footer .wrap { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <nav>
      <a class="logo" href="/"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>Unhackable Blog</a>
      <div class="links"><a href="/">Posts</a><a href="/write">Write</a></div>
    </nav>
{{end}}

{{define "foot"}}
<footer>
  <div class="wrap">
    <span>© {{.Year}} Unhackable Blog · 0 CVEs · hardened by default</span>
    <span>build {{.Version}} · link checker: {{.Checker}}</span>
  </div>
</footer>
</body>
</html>{{end}}
